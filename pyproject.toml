[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barkwatch"
version = "0.1.0"
description = "Local-first dog bark detection, logging and reporting for Home Assistant"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "paho-mqtt>=2.0",
  "sounddevice>=0.4.6",
]

[project.optional-dependencies]
yamnet = ["ai-edge-litert>=1.0"]
flac = ["soundfile>=0.12"]
doa = ["pyusb>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
barkwatch = "barkwatch.__main__:main"

[tool.setuptools]
packages = ["barkwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
