# Create the password file first:
#   docker run --rm -v "$PWD/deploy/mosquitto:/m" eclipse-mosquitto:2 mosquitto_passwd -c -b /m/passwd barkwatch 'change-me'
#   (add a second user for Home Assistant with -b without -c)
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
